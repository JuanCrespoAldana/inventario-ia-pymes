server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Todas las rutas (ej. /login, /dashboard) las maneja React Router en el
    # navegador -- si no existe el archivo, se devuelve index.html en vez de
    # un 404, para que recargar la pagina en /dashboard no rompa nada.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
